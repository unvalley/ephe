[package]
name = "ephe_tauri"
version = "0.0.1"
description = "Ephe Tauri experiment"
authors = ["unvalley"]
edition = "2021"
rust-version = "1.86"

[lib]
name = "ephe_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"
walkdir = "2.5"
